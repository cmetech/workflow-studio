name: Native release draft

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate exact release tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release-ref.outputs.tag }}
      commit: ${{ steps.release-ref.outputs.commit }}
    steps:
      - name: Validate requested tag syntax
        id: requested-ref
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$REQUESTED_TAG"
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Invalid version tag: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ format('refs/tags/{0}', steps.requested-ref.outputs.tag) }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
      - name: Validate tag, version, and base ancestry
        id: release-ref
        env:
          REQUESTED_TAG: ${{ steps.requested-ref.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$REQUESTED_TAG"
          TAG_COMMIT=$(git rev-parse "refs/tags/$TAG^{commit}")
          git fetch --no-tags origin base:refs/remotes/origin/base
          if ! git merge-base --is-ancestor "$TAG_COMMIT" "origin/base"; then
            echo "Tag $TAG is not on base" >&2
            exit 1
          fi
          CONFIG_VERSION=$(node -p "JSON.parse(require('node:fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version")
          if [[ "$TAG" != "v$CONFIG_VERSION" ]]; then
            echo "Tag $TAG does not match Tauri version $CONFIG_VERSION" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$TAG_COMMIT" >> "$GITHUB_OUTPUT"
      - name: Check existing release state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release-ref.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          EXISTING_DRAFT=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG" --jq .draft 2>/dev/null || true)
          if [[ -n "$EXISTING_DRAFT" && "$EXISTING_DRAFT" != "true" ]]; then
            echo "Release $TAG already exists and is not a draft" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    needs: validate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # Tauri Action merges latest.json on the draft; serialize uploads so no
      # platform can overwrite another platform's updater entry.
      max-parallel: 1
      matrix:
        include:
          - runner: macos-latest
            platform: macos
            arch: aarch64
            rust_target: aarch64-apple-darwin
            bundles: dmg
          - runner: macos-15-intel
            platform: macos
            arch: x86_64
            rust_target: x86_64-apple-darwin
            bundles: dmg
          - runner: windows-latest
            platform: windows
            arch: x86_64
            rust_target: x86_64-pc-windows-msvc
            bundles: nsis
          - runner: ubuntu-24.04
            platform: linux
            arch: x86_64
            rust_target: x86_64-unknown-linux-gnu
            bundles: appimage
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install Rust target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add "${{ matrix.rust_target }}"
      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: npm ci
      - name: Verify application, contract, and examples
        run: |
          npm run verify
          npm run contracts:check
          npm run examples:check
      - name: Assert tag still resolves to the validated commit
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "refs/tags/$TAG"
          REMOTE_TAG_COMMIT=$(git rev-parse 'FETCH_HEAD^{commit}')
          if [[ "$REMOTE_TAG_COMMIT" != "$EXPECTED_COMMIT" ]]; then
            echo "Tag moved after validation: $TAG" >&2
            exit 1
          fi
      - name: Build and upload unsigned native bundle to a draft release
        id: tauri
        # tauri-apps/tauri-action v1 resolved and reviewed at 1deb371b0cd8bd54025b384f1cd735e725c4060f
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.validate.outputs.tag }}
          releaseCommitish: ${{ needs.validate.outputs.commit }}
          releaseName: LOOP24 Workflow Studio ${{ needs.validate.outputs.tag }}
          releaseBody: Native operating-system artifacts are unsigned. Review docs/installing.md before installation.
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          releaseAssetNamePattern: LOOP24-Workflow-Studio_[version]_${{ matrix.platform }}_${{ matrix.arch }}[setup][ext]
          args: --target ${{ matrix.rust_target }} --bundles ${{ matrix.bundles }}

  verify:
    name: Verify complete draft and publish checksums
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Install Linux bundle dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Build updater signature verifier
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --example verify_release_signature
      - name: Assert tag still resolves to the validated commit
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "refs/tags/$TAG"
          REMOTE_TAG_COMMIT=$(git rev-parse 'FETCH_HEAD^{commit}')
          if [[ "$REMOTE_TAG_COMMIT" != "$EXPECTED_COMMIT" ]]; then
            echo "Tag moved after validation: $TAG" >&2
            exit 1
          fi
      - name: Download draft assets for metadata normalization
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          ASSET_DIR="$RUNNER_TEMP/workflow-studio-release-assets"
          test ! -e "$ASSET_DIR"
          mkdir "$ASSET_DIR"
          RELEASE=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG")
          if [[ "$(jq -r .draft <<< "$RELEASE")" != "true" ]] || \
             [[ "$(jq -r .tag_name <<< "$RELEASE")" != "$TAG" ]] || \
             [[ "$(jq -r .target_commitish <<< "$RELEASE")" != "$EXPECTED_COMMIT" ]]; then
            echo "Exact draft release $TAG was not found" >&2
            exit 1
          fi
          while IFS=$'\t' read -r ASSET_ID ASSET_NAME; do
            if [[ ! "$ASSET_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
              echo "Unsafe release asset name: $ASSET_NAME" >&2
              exit 1
            fi
            if [[ "$ASSET_NAME" == "SHA256SUMS" ]]; then
              # A rerun may find this exact draft's prior generated manifest.
              # Delete only that known asset, then regenerate it over current bytes.
              gh api "repos/${GITHUB_REPOSITORY}/releases/assets/$ASSET_ID" --method DELETE
              continue
            fi
            gh api "repos/${GITHUB_REPOSITORY}/releases/assets/$ASSET_ID" \
              -H 'Accept: application/octet-stream' > "$ASSET_DIR/$ASSET_NAME"
            test -s "$ASSET_DIR/$ASSET_NAME"
          done < <(jq -r '.assets[] | [.id, .name] | @tsv' <<< "$RELEASE")
      - name: Normalize updater metadata without release credentials
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          ASSET_DIR="$RUNNER_TEMP/workflow-studio-release-assets"
          node scripts/verify-release-assets.mjs --directory "$ASSET_DIR" --tag "$TAG" --normalize-updater
      - name: Upload normalized updater metadata
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          ASSET_DIR="$RUNNER_TEMP/workflow-studio-release-assets"
          gh release upload "$TAG" "$ASSET_DIR/latest.json" --clobber
      - name: Re-download published updater bytes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          ASSET_DIR="$RUNNER_TEMP/workflow-studio-release-assets"
          find "$ASSET_DIR" -mindepth 1 -maxdepth 1 -type f -delete
          RELEASE=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG")
          if [[ "$(jq -r .draft <<< "$RELEASE")" != "true" ]] || \
             [[ "$(jq -r .tag_name <<< "$RELEASE")" != "$TAG" ]] || \
             [[ "$(jq -r .target_commitish <<< "$RELEASE")" != "$EXPECTED_COMMIT" ]]; then
            echo "Exact draft release $TAG was not found" >&2
            exit 1
          fi
          while IFS=$'\t' read -r ASSET_ID ASSET_NAME; do
            [[ "$ASSET_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
            gh api "repos/${GITHUB_REPOSITORY}/releases/assets/$ASSET_ID" \
              -H 'Accept: application/octet-stream' > "$ASSET_DIR/$ASSET_NAME"
            test -s "$ASSET_DIR/$ASSET_NAME"
          done < <(jq -r '.assets[] | [.id, .name] | @tsv' <<< "$RELEASE")
      - name: Generate checksums from published bytes without release credentials
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          ASSET_DIR="$RUNNER_TEMP/workflow-studio-release-assets"
          SIGNATURE_VERIFIER="src-tauri/target/debug/examples/verify_release_signature"
          node scripts/verify-release-assets.mjs --directory "$ASSET_DIR" --tag "$TAG" --write-checksums --signature-verifier "$SIGNATURE_VERIFIER" --tauri-config src-tauri/tauri.conf.json
      - name: Upload checksum manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          ASSET_DIR="$RUNNER_TEMP/workflow-studio-release-assets"
          gh release upload "$TAG" "$ASSET_DIR/SHA256SUMS"
      - name: Re-download completed draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          ASSET_DIR="$RUNNER_TEMP/workflow-studio-release-assets"
          find "$ASSET_DIR" -mindepth 1 -maxdepth 1 -type f -delete
          RELEASE=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG")
          if [[ "$(jq -r .draft <<< "$RELEASE")" != "true" ]] || \
             [[ "$(jq -r .tag_name <<< "$RELEASE")" != "$TAG" ]] || \
             [[ "$(jq -r .target_commitish <<< "$RELEASE")" != "$EXPECTED_COMMIT" ]]; then
            echo "Exact draft release $TAG was not found" >&2
            exit 1
          fi
          while IFS=$'\t' read -r ASSET_ID ASSET_NAME; do
            [[ "$ASSET_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
            gh api "repos/${GITHUB_REPOSITORY}/releases/assets/$ASSET_ID" \
              -H 'Accept: application/octet-stream' > "$ASSET_DIR/$ASSET_NAME"
            test -s "$ASSET_DIR/$ASSET_NAME"
          done < <(jq -r '.assets[] | [.id, .name] | @tsv' <<< "$RELEASE")
      - name: Validate completed draft without release credentials
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          ASSET_DIR="$RUNNER_TEMP/workflow-studio-release-assets"
          SIGNATURE_VERIFIER="src-tauri/target/debug/examples/verify_release_signature"
          node scripts/verify-release-assets.mjs --directory "$ASSET_DIR" --tag "$TAG" --signature-verifier "$SIGNATURE_VERIFIER" --tauri-config src-tauri/tauri.conf.json
          echo 'Draft release verified; publish it manually after review.'
