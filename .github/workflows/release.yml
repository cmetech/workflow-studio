name: Native release draft

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate exact release tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release-ref.outputs.tag }}
      application_commit: ${{ steps.release-ref.outputs.application_commit }}
      tooling_commit: ${{ github.sha }}
      release_id: ${{ steps.draft-release.outputs.release_id }}
    permissions:
      contents: write
    steps:
      - name: Validate dispatch ref and tag syntax
        id: requested-ref
        env:
          DISPATCH_REF: ${{ github.ref }}
          REQUESTED_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$DISPATCH_REF" == "refs/heads/base" ]]; then
            echo "Release workflow must be dispatched from base, not $DISPATCH_REF" >&2
            exit 1
          fi
          TAG="$REQUESTED_TAG"
          SEMVER_PATTERN='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+)(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$TAG" =~ $SEMVER_PATTERN ]]; then
            echo "Invalid version tag: $TAG" >&2
            exit 1
          fi
          if [[ "$TAG" == *-* ]]; then
            PRERELEASE=${TAG#*-}
            IFS='.' read -r -a PRERELEASE_IDENTIFIERS <<< "$PRERELEASE"
            for IDENTIFIER in "${PRERELEASE_IDENTIFIERS[@]}"; do
              if [[ "$IDENTIFIER" =~ ^0[0-9]+$ ]]; then
                echo "Invalid version tag: $TAG" >&2
                exit 1
              fi
            done
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Checkout immutable tagged application
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ format('refs/tags/{0}', steps.requested-ref.outputs.tag) }}
          persist-credentials: false
      - name: Validate immutable application and tooling commits
        id: release-ref
        env:
          TAG: ${{ steps.requested-ref.outputs.tag }}
          TOOLING_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          TAG_COMMIT=$(git rev-parse "refs/tags/$TAG^{commit}")
          if [[ "$(git rev-parse HEAD)" != "$TAG_COMMIT" ]]; then
            echo "Application checkout does not match immutable tag $TAG" >&2
            exit 1
          fi
          git fetch --no-tags origin base:refs/remotes/origin/base
          if ! git merge-base --is-ancestor "$TOOLING_COMMIT" "origin/base"; then
            echo "Release tooling commit $TOOLING_COMMIT does not belong to base" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TAG_COMMIT" "origin/base"; then
            echo "Tag $TAG is not on base" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "application_commit=$TAG_COMMIT" >> "$GITHUB_OUTPUT"
          {
            echo '### Validated release boundary'
            echo "- Application tag: \`$TAG\`"
            echo "- Application commit: \`$TAG_COMMIT\`"
            echo "- Release tooling commit: \`$TOOLING_COMMIT\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
      - name: Validate tagged application identity
        env:
          TAG: ${{ steps.release-ref.outputs.tag }}
          EXPECTED_COMMIT: ${{ steps.release-ref.outputs.application_commit }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$EXPECTED_COMMIT" ]]; then
            echo "Application checkout does not match validated tag commit" >&2
            exit 1
          fi
          CONFIG_VERSION=$(node -p "JSON.parse(require('node:fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version")
          if [[ "$TAG" != "v$CONFIG_VERSION" ]]; then
            echo "Tag $TAG does not match Tauri version $CONFIG_VERSION" >&2
            exit 1
          fi
      - name: Checkout pinned release tooling
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          path: .release-tooling
          persist-credentials: false
      - name: Create and validate exact draft release
        id: draft-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release-ref.outputs.tag }}
          EXPECTED_COMMIT: ${{ steps.release-ref.outputs.application_commit }}
        shell: bash
        run: |
          set -euo pipefail
          node .release-tooling/scripts/resolve-release.mjs \
            --mode absent \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --expected-commit "$EXPECTED_COMMIT"
          RELEASE_BODY='Native operating-system artifacts are unsigned. Review docs/installing.md before installation.'
          jq -n \
            --arg tag "$TAG" \
            --arg commit "$EXPECTED_COMMIT" \
            --arg name "LOOP24 Workflow Studio $TAG" \
            --arg body "$RELEASE_BODY" \
            '{tag_name: $tag, target_commitish: $commit, name: $name, body: $body, draft: true, prerelease: false}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" --input - > /dev/null
          RELEASE_ID=$(node .release-tooling/scripts/resolve-release.mjs \
            --mode exact-draft \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --expected-commit "$EXPECTED_COMMIT" \
            --output id)
          node -e 'const value = process.argv[1]; if (!/^[1-9][0-9]*$/.test(value) || !Number.isSafeInteger(Number(value))) process.exit(1)' "$RELEASE_ID"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    needs: validate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # Tauri Action merges latest.json on the draft; serialize uploads so no
      # platform can overwrite another platform's updater entry.
      max-parallel: 1
      matrix:
        include:
          - runner: macos-latest
            platform: macos
            arch: aarch64
            rust_target: aarch64-apple-darwin
            bundles: app,dmg
          - runner: macos-15-intel
            platform: macos
            arch: x86_64
            rust_target: x86_64-apple-darwin
            bundles: app,dmg
          - runner: windows-latest
            platform: windows
            arch: x86_64
            rust_target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout immutable tagged application
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.application_commit }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install Rust target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add "${{ matrix.rust_target }}"
      - run: npm ci
      - name: Build release signature verifier
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --example verify_release_signature
      - name: Verify application, contract, and examples
        run: |
          npm run format:check
          npm run lint
          npm run check
          npm run test:unit -- --testTimeout=20000 --maxWorkers=1
          npm run test:rust
          npm run contracts:check
          npm run examples:check
      - name: Assert tag still resolves to the validated commit
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.validate.outputs.application_commit }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "refs/tags/$TAG"
          REMOTE_TAG_COMMIT=$(git rev-parse 'FETCH_HEAD^{commit}')
          if [[ "$REMOTE_TAG_COMMIT" != "$EXPECTED_COMMIT" ]]; then
            echo "Tag moved after validation: $TAG" >&2
            exit 1
          fi
      - name: Checkout pinned release tooling
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.tooling_commit }}
          path: .release-tooling
          persist-credentials: false
      - name: Validate draft release ID
        env:
          RELEASE_ID: ${{ needs.validate.outputs.release_id }}
        run: |
          node -e 'const value = process.argv[1]; if (!/^[1-9][0-9]*$/.test(value) || !Number.isSafeInteger(Number(value))) process.exit(1)' "$RELEASE_ID"
      - name: Build and upload unsigned native bundle to a draft release
        id: tauri
        # tauri-apps/tauri-action v1 resolved and reviewed at 1deb371b0cd8bd54025b384f1cd735e725c4060f
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.validate.outputs.release_id }}
          releaseBody: Native operating-system artifacts are unsigned. Review docs/installing.md before installation.
          updaterJsonPreferNsis: true
          releaseAssetNamePattern: LOOP24-Workflow-Studio_[version]_${{ matrix.platform }}_${{ matrix.arch }}[setup][ext]
          args: --target ${{ matrix.rust_target }} --bundles ${{ matrix.bundles }}
      - name: Verify extracted macOS DMG payload
        if: ${{ matrix.platform == 'macos' }}
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg"
          DMG_FILES=()
          while IFS= read -r -d '' FILE; do
            DMG_FILES+=("$FILE")
          done < <(find "$BUNDLE_DIR" -mindepth 1 -maxdepth 1 -type f -name '*.dmg' -print0)
          if (( ${#DMG_FILES[@]} != 1 )); then
            echo "Expected exactly one Tauri DMG in $BUNDLE_DIR, found ${#DMG_FILES[@]}" >&2
            exit 1
          fi

          MOUNT_DIR=$(mktemp -d "$RUNNER_TEMP/workflow-studio-dmg.XXXXXX")
          MOUNTED=false
          cleanup() {
            STATUS=$?
            trap - EXIT
            if [[ "$MOUNTED" == "true" ]] && ! hdiutil detach "$MOUNT_DIR"; then
              echo "Failed to detach verified DMG at $MOUNT_DIR" >&2
              STATUS=1
            fi
            rmdir "$MOUNT_DIR" 2>/dev/null || true
            exit "$STATUS"
          }
          trap cleanup EXIT

          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT_DIR" "${DMG_FILES[0]}"
          MOUNTED=true
          APP_BUNDLES=()
          while IFS= read -r -d '' APP; do
            APP_BUNDLES+=("$APP")
          done < <(find "$MOUNT_DIR" -mindepth 1 -maxdepth 1 -type d -name '*.app' -print0)
          if (( ${#APP_BUNDLES[@]} != 1 )); then
            echo "Expected exactly one application bundle in the DMG, found ${#APP_BUNDLES[@]}" >&2
            exit 1
          fi

          RESOURCE_ROOT="${APP_BUNDLES[0]}/Contents/Resources/_up_"
          node .release-tooling/scripts/verify-release-assets.mjs \
            --packaged-resource-root "$RESOURCE_ROOT" \
            --integrity-manifest src-tauri/resources/setup-integrity-v1.json
      - name: Verify extracted Windows NSIS payload
        if: ${{ matrix.platform == 'windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundleDirectory = 'src-tauri/target/${{ matrix.rust_target }}/release/bundle/nsis'
          $installers = @(Get-ChildItem -LiteralPath $bundleDirectory -File -Filter '*-setup.exe')
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Tauri NSIS setup executable in $bundleDirectory, found $($installers.Count)"
          }

          $extractRoot = Join-Path $env:RUNNER_TEMP "workflow-studio-nsis-$([guid]::NewGuid().ToString('N'))"
          New-Item -ItemType Directory -Path $extractRoot | Out-Null
          try {
            & 7z x "-o$extractRoot" -y $installers[0].FullName
            if ($LASTEXITCODE -ne 0) {
              throw "7-Zip failed to extract $($installers[0].FullName)"
            }

            $resourceRoots = @(
              Get-ChildItem -LiteralPath $extractRoot -Directory -Filter '_up_' -Recurse |
                Where-Object { -not ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) }
            )
            if ($resourceRoots.Count -ne 1) {
              throw "Expected exactly one packaged _up_ resource root, found $($resourceRoots.Count)"
            }

            $applicationRoot = Split-Path -Parent $resourceRoots[0].FullName
            $expectedApplicationName = 'workflow-studio.exe'
            $executables = @(
              Get-ChildItem -LiteralPath $applicationRoot -File -Recurse |
                Where-Object { $_.Name -ieq $expectedApplicationName }
            )
            if ($executables.Count -ne 1) {
              throw "Expected exactly one $expectedApplicationName application executable, found $($executables.Count)"
            }

            & node .release-tooling/scripts/verify-release-assets.mjs `
              --packaged-resource-root $resourceRoots[0].FullName `
              --integrity-manifest src-tauri/resources/setup-integrity-v1.json `
              --pe-executable $executables[0].FullName
            if ($LASTEXITCODE -ne 0) {
              throw 'Extracted NSIS payload verification failed'
            }
          } finally {
            Remove-Item -LiteralPath $extractRoot -Recurse -Force
          }

  verify:
    name: Verify complete draft and publish checksums
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout immutable tagged application
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.application_commit }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Install tagged verifier dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Build updater signature verifier
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --example verify_release_signature
      - name: Assert tag still resolves to the validated commit
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.validate.outputs.application_commit }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "refs/tags/$TAG"
          REMOTE_TAG_COMMIT=$(git rev-parse 'FETCH_HEAD^{commit}')
          if [[ "$REMOTE_TAG_COMMIT" != "$EXPECTED_COMMIT" ]]; then
            echo "Tag moved after validation: $TAG" >&2
            exit 1
          fi
      - name: Checkout pinned release tooling
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.tooling_commit }}
          path: .release-tooling
          persist-credentials: false
      - name: Validate draft release ID
        env:
          RELEASE_ID: ${{ needs.validate.outputs.release_id }}
        run: |
          node -e 'const value = process.argv[1]; if (!/^[1-9][0-9]*$/.test(value) || !Number.isSafeInteger(Number(value))) process.exit(1)' "$RELEASE_ID"
      - name: Download draft assets for metadata normalization
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.validate.outputs.application_commit }}
          RELEASE_ID: ${{ needs.validate.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          ASSET_DIR="$RUNNER_TEMP/workflow-studio-release-assets"
          test ! -e "$ASSET_DIR"
          mkdir "$ASSET_DIR"
          RELEASE=$(node .release-tooling/scripts/resolve-release.mjs \
            --mode exact-draft \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --expected-commit "$EXPECTED_COMMIT" \
            --expected-id "$RELEASE_ID" \
            --output json)
          while IFS=$'\t' read -r ASSET_ID ASSET_NAME; do
            if [[ ! "$ASSET_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
              echo "Unsafe release asset name: $ASSET_NAME" >&2
              exit 1
            fi
            gh api "repos/${GITHUB_REPOSITORY}/releases/assets/$ASSET_ID" \
              -H 'Accept: application/octet-stream' > "$ASSET_DIR/$ASSET_NAME"
            test -s "$ASSET_DIR/$ASSET_NAME"
          done < <(jq -r '.assets[] | [.id, .name] | @tsv' <<< "$RELEASE")
      - name: Normalize updater metadata without release credentials
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          ASSET_DIR="$RUNNER_TEMP/workflow-studio-release-assets"
          node .release-tooling/scripts/verify-release-assets.mjs --directory "$ASSET_DIR" --tag "$TAG" --normalize-updater
      - name: Upload normalized updater metadata
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.validate.outputs.application_commit }}
          RELEASE_ID: ${{ needs.validate.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          ASSET_DIR="$RUNNER_TEMP/workflow-studio-release-assets"
          RELEASE=$(node .release-tooling/scripts/resolve-release.mjs \
            --mode exact-draft \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --expected-commit "$EXPECTED_COMMIT" \
            --expected-id "$RELEASE_ID" \
            --output json)
          EXISTING_ASSET_ID=$(jq -r '.assets[] | select(.name == "latest.json") | .id' <<< "$RELEASE")
          if [[ -z "$EXISTING_ASSET_ID" ]]; then
            echo 'Validated draft is missing latest.json' >&2
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/assets/$EXISTING_ASSET_ID" --method DELETE
          curl --fail-with-body --silent --show-error --location \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Content-Type: application/octet-stream' \
            --data-binary "@$ASSET_DIR/latest.json" \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID/assets?name=latest.json" \
            > /dev/null
      - name: Re-download published updater bytes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.validate.outputs.application_commit }}
          RELEASE_ID: ${{ needs.validate.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          ASSET_DIR="$RUNNER_TEMP/workflow-studio-release-assets"
          find "$ASSET_DIR" -mindepth 1 -maxdepth 1 -type f -delete
          RELEASE=$(node .release-tooling/scripts/resolve-release.mjs \
            --mode exact-draft \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --expected-commit "$EXPECTED_COMMIT" \
            --expected-id "$RELEASE_ID" \
            --output json)
          while IFS=$'\t' read -r ASSET_ID ASSET_NAME; do
            [[ "$ASSET_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
            gh api "repos/${GITHUB_REPOSITORY}/releases/assets/$ASSET_ID" \
              -H 'Accept: application/octet-stream' > "$ASSET_DIR/$ASSET_NAME"
            test -s "$ASSET_DIR/$ASSET_NAME"
          done < <(jq -r '.assets[] | [.id, .name] | @tsv' <<< "$RELEASE")
      - name: Generate checksums from published bytes without release credentials
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          ASSET_DIR="$RUNNER_TEMP/workflow-studio-release-assets"
          SIGNATURE_VERIFIER="src-tauri/target/debug/examples/verify_release_signature"
          node .release-tooling/scripts/verify-release-assets.mjs --directory "$ASSET_DIR" --tag "$TAG" --write-checksums --signature-verifier "$SIGNATURE_VERIFIER" --tauri-config src-tauri/tauri.conf.json
      - name: Upload checksum manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.validate.outputs.application_commit }}
          RELEASE_ID: ${{ needs.validate.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          ASSET_DIR="$RUNNER_TEMP/workflow-studio-release-assets"
          RELEASE=$(node .release-tooling/scripts/resolve-release.mjs \
            --mode exact-draft \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --expected-commit "$EXPECTED_COMMIT" \
            --expected-id "$RELEASE_ID" \
            --output json)
          EXISTING_ASSET_ID=$(jq -r '.assets[] | select(.name == "SHA256SUMS") | .id' <<< "$RELEASE")
          if [[ -n "$EXISTING_ASSET_ID" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/assets/$EXISTING_ASSET_ID" --method DELETE
          fi
          curl --fail-with-body --silent --show-error --location \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Content-Type: application/octet-stream' \
            --data-binary "@$ASSET_DIR/SHA256SUMS" \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID/assets?name=SHA256SUMS" \
            > /dev/null
      - name: Re-download completed draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          EXPECTED_COMMIT: ${{ needs.validate.outputs.application_commit }}
          RELEASE_ID: ${{ needs.validate.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          ASSET_DIR="$RUNNER_TEMP/workflow-studio-release-assets"
          find "$ASSET_DIR" -mindepth 1 -maxdepth 1 -type f -delete
          RELEASE=$(node .release-tooling/scripts/resolve-release.mjs \
            --mode exact-draft \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --expected-commit "$EXPECTED_COMMIT" \
            --expected-id "$RELEASE_ID" \
            --output json)
          while IFS=$'\t' read -r ASSET_ID ASSET_NAME; do
            [[ "$ASSET_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
            gh api "repos/${GITHUB_REPOSITORY}/releases/assets/$ASSET_ID" \
              -H 'Accept: application/octet-stream' > "$ASSET_DIR/$ASSET_NAME"
            test -s "$ASSET_DIR/$ASSET_NAME"
          done < <(jq -r '.assets[] | [.id, .name] | @tsv' <<< "$RELEASE")
      - name: Validate completed draft without release credentials
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          ASSET_DIR="$RUNNER_TEMP/workflow-studio-release-assets"
          SIGNATURE_VERIFIER="src-tauri/target/debug/examples/verify_release_signature"
          node .release-tooling/scripts/verify-release-assets.mjs --directory "$ASSET_DIR" --tag "$TAG" --signature-verifier "$SIGNATURE_VERIFIER" --tauri-config src-tauri/tauri.conf.json
          echo 'Draft release verified; publish it manually after review.'
