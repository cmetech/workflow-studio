name: Native release draft

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate exact release tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release-ref.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
      - name: Validate tag, version, base ancestry, and draft state
        id: release-ref
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$REQUESTED_TAG"
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Invalid version tag: $TAG" >&2
            exit 1
          fi
          TAG_COMMIT=$(git rev-parse "refs/tags/$TAG^{commit}")
          git fetch --no-tags origin base:refs/remotes/origin/base
          if ! git merge-base --is-ancestor "$TAG_COMMIT" "origin/base"; then
            echo "Tag $TAG is not on base" >&2
            exit 1
          fi
          CONFIG_VERSION=$(node -p "JSON.parse(require('node:fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version")
          if [[ "$TAG" != "v$CONFIG_VERSION" ]]; then
            echo "Tag $TAG does not match Tauri version $CONFIG_VERSION" >&2
            exit 1
          fi
          EXISTING_DRAFT=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG" --jq .draft 2>/dev/null || true)
          if [[ -n "$EXISTING_DRAFT" && "$EXISTING_DRAFT" != "true" ]]; then
            echo "Release $TAG already exists and is not a draft" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    needs: validate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # Tauri Action merges latest.json on the draft; serialize uploads so no
      # platform can overwrite another platform's updater entry.
      max-parallel: 1
      matrix:
        include:
          - runner: macos-latest
            platform: macos
            arch: aarch64
            rust_target: aarch64-apple-darwin
            bundles: dmg
          - runner: macos-15-intel
            platform: macos
            arch: x86_64
            rust_target: x86_64-apple-darwin
            bundles: dmg
          - runner: windows-latest
            platform: windows
            arch: x86_64
            rust_target: x86_64-pc-windows-msvc
            bundles: nsis
          - runner: ubuntu-24.04
            platform: linux
            arch: x86_64
            rust_target: x86_64-unknown-linux-gnu
            bundles: appimage
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install Rust target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add "${{ matrix.rust_target }}"
      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: npm ci
      - name: Verify application, contract, and examples
        run: |
          npm run verify
          npm run contracts:check
          npm run examples:check
      - name: Build and upload unsigned native bundle to a draft release
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.validate.outputs.tag }}
          releaseCommitish: ${{ needs.validate.outputs.tag }}
          releaseName: LOOP24 Workflow Studio ${{ needs.validate.outputs.tag }}
          releaseBody: Native operating-system artifacts are unsigned. Review docs/installing.md before installation.
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          releaseAssetNamePattern: LOOP24-Workflow-Studio_[version]_${{ matrix.platform }}_${{ matrix.arch }}[setup][ext]
          args: --target ${{ matrix.rust_target }} --bundles ${{ matrix.bundles }}

  verify:
    name: Verify complete draft and publish checksums
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Download and authenticate every draft asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$TAG")
          if [[ "$(jq -r .draft <<< "$RELEASE")" != "true" ]] || [[ "$(jq -r .tag_name <<< "$RELEASE")" != "$TAG" ]]; then
            echo "Exact draft release $TAG was not found" >&2
            exit 1
          fi
          mkdir release-assets
          while IFS=$'\t' read -r ASSET_ID ASSET_NAME; do
            if [[ ! "$ASSET_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
              echo "Unsafe release asset name: $ASSET_NAME" >&2
              exit 1
            fi
            if [[ "$ASSET_NAME" == "SHA256SUMS" ]]; then
              # A rerun may find this exact draft's prior generated manifest.
              # Delete only that known asset, then regenerate it over current bytes.
              gh api "repos/${GITHUB_REPOSITORY}/releases/assets/$ASSET_ID" --method DELETE
              continue
            fi
            gh api "repos/${GITHUB_REPOSITORY}/releases/assets/$ASSET_ID" \
              -H 'Accept: application/octet-stream' > "release-assets/$ASSET_NAME"
            test -s "release-assets/$ASSET_NAME"
          done < <(jq -r '.assets[] | [.id, .name] | @tsv' <<< "$RELEASE")
          node scripts/verify-release-assets.mjs --directory release-assets --tag "$TAG" --write-checksums
          gh release upload "$TAG" release-assets/SHA256SUMS
          echo 'Draft release verified; publish it manually after review.'
