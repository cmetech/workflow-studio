name: CI

on:
  pull_request:
  push:
    branches: [base]

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: rustup toolchain install 1.88.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm run contracts:check
      - run: npm run examples:check
      # Bundle regression tests inspect the real emitted manifest, including on a clean runner.
      - run: npm run build
      - name: Phase 3 performance and accessibility
        run: npm run test:unit -- tests/performance tests/accessibility
      - run: npm run test:unit -- --testTimeout=20000 --hookTimeout=600000 --maxWorkers=1
      - run: cargo +1.88.0 check --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo +1.88.0 test --locked --manifest-path src-tauri/Cargo.toml

  renderer-e2e:
    name: Deterministic renderer E2E
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      # Shared runners enforce deterministic module budgets in the quality job.
      # Perceptual 50 ms / 3 s timing remains enabled on native reference machines.
      - run: npm run test:e2e
        env:
          WORKFLOW_STUDIO_PERCEPTUAL_PERFORMANCE: off
      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  windows-functional-e2e:
    name: Windows functional E2E (${{ matrix.id }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: shard-1-of-2
            shard: 1/2
            port: 1421
            output: test-results-shard-1
          - id: shard-2-of-2
            shard: 2/2
            port: 1422
            output: test-results-shard-2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Run functional Chromium shard
        run: npm.cmd run test:e2e:functional:windows -- --shard=${{ matrix.shard }}
        env:
          WORKFLOW_STUDIO_E2E_PORT: ${{ matrix.port }}
          WORKFLOW_STUDIO_E2E_OUTPUT_DIR: ${{ matrix.output }}
      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-playwright-${{ matrix.id }}
          path: |
            playwright-report/
            ${{ matrix.output }}/
          if-no-files-found: ignore
          retention-days: 14

  native-bundle:
    name: Native debug bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: rustup toolchain install 1.88.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: cargo +1.88.0 check --locked --manifest-path src-tauri/Cargo.toml
      - name: Test complete Windows native suite
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo +1.88.0 test --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=1 2>&1 | Tee-Object -FilePath rust-test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Windows checkout and installer contracts
        if: runner.os == 'Windows'
        run: npm run test:unit -- tests/project/line-ending-contract.test.ts tests/installers/install-script.test.ts --testTimeout=20000 --hookTimeout=600000 --maxWorkers=1
      - name: Build Windows renderer bundle
        if: runner.os == 'Windows'
        run: npm run build
      - name: Enforce Windows renderer bundle budget
        if: runner.os == 'Windows'
        run: npm run bundle:check
      - run: npx --no-install tauri build --debug --config src-tauri/tauri.ci.conf.json
      - name: Upload native failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-failure-${{ matrix.os }}
          path: |
            rust-test.log
            dist/.vite/manifest.json
            dist/.vite/elk-provenance/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
