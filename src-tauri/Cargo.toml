[package]
name = "workflow-studio"
version = "1.0.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "workflow_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
base64 = "=0.22.1"
minisign-verify = "=0.2.5"
serde_json = "1"
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "=0.22.1"
cap-std = "=3.4.5"
getrandom = "0.3.4"
libc = "0.2"
minisign-verify = "=0.2.5"
notify = "8.2.0"
png = "=0.18.1"
quick-xml = "=0.38.4"
same-file = "1.0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "=0.9.34"
sha2 = "0.10.9"
tauri = { version = "2.11.5", features = ["image-png"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-log = "2.9.0"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
open = "5.4.0"
tempfile = "3.27"
wait-timeout = "0.2.1"
trash = "=5.2.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }
