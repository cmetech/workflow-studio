name: Parallel fan-in
description: Two children run after a root and join.
nodes:
  - id: root
    command: /collect
  - id: left
    prompt: Analyze the left part from $root.output
    depends_on: [root]
  - id: right
    prompt: Analyze the right part from $root.output
    depends_on: [root]
  - id: join
    prompt: Combine $left.output with $right.output
    depends_on: [left, right]
