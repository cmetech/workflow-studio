name: CI

on:
  pull_request:
  push:
    branches: [base]

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: rustup toolchain install 1.77.2 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm run contracts:check
      - run: npm run examples:check
      - name: Phase 3 performance and accessibility
        run: npm run test:unit -- tests/performance tests/accessibility
      - run: npm run test:unit
      - run: cargo +1.77.2 check --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo +1.77.2 test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run build

  renderer-e2e:
    name: Deterministic renderer E2E
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Install Chromium only
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  native-bundle:
    name: Native debug bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri -- build --debug --config src-tauri/tauri.ci.conf.json
